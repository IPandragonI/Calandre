<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calandre — Hors ligne</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f5f0; --ink: #17181b; --accent: #c2410c; }
      @media (prefers-color-scheme: dark) { :root { --bg: #121315; --ink: #ecebe6; --accent: #f47634; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 26rem; text-align: center; }
      h1 { font-size: 1.6rem; font-style: italic; font-stretch: 125%; margin: 0.5rem 0; }
      a { display: inline-block; margin-top: 1rem; padding: 0.7rem 1.4rem; border-radius: 0.75rem; background: var(--accent);
        color: #fff; text-decoration: none; font-weight: 600; }
      p { opacity: 0.8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Vous êtes hors ligne</h1>
      <p>Cette page n'a pas encore été enregistrée sur l'appareil. Les pages et photos déjà consultées restent jouables.</p>
      <p lang="en">You're offline. This page hasn't been saved on this device yet; pages and photos you've already opened still work.</p>
      <a href="/">Accueil / Home</a>
    </main>
  </body>
</html>
